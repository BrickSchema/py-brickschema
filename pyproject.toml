[project]
name = "brickschema"
version = "0.7.10a1"
description = "A library for working with the Brick ontology for buildings (brickschema.org)"
authors = [
    { name = "Gabe Fierro", email = "gtfierro@mines.edu" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
keywords = [
    "brick",
    "buildings",
    "bms",
    "ontology",
    "rdf",
    "semantic-web",
    "shacl",
    "sparql",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "owlrl>=7.1.3",
    "pyshacl>=0.30.1",
    "pyshifty>=0.4.4",
    "rdflib>=7.1.4",
]
requires-python = ">=3.11,<4.0"

[project.urls]
Homepage = "https://brickschema.org"
Documentation = "https://brickschema.readthedocs.io/en/latest/"
Repository = "https://github.com/BrickSchema/py-brickschema"
Issues = "https://github.com/BrickSchema/py-brickschema/issues"

[project.scripts]
# documented in the README and docs/brickify/, but no entry point was ever
# declared, so `pip install brickschema[brickify]` gave you no command
brickify = "brickschema.brickify.main:app"

[project.optional-dependencies]
allegro = [
    "docker>=7.1.0",
]
brickify = [
    "click-spinner>=0.1.10",
    "importlib-resources>=6.5.2",
    "jinja2>=3.1.6",
    "pyyaml>=6.0.2",
    "tabulate>=0.9.0",
    "typer>=0.16.0",
    "xlrd>=2.0.2",
]
web = [
    "flask>=3.1.1",
]
merge = [
    "colorama>=0.4.6",
    "dedupe>=3.0.3",
]
orm = [
    "sqlalchemy>=2.0.41",
]
reasonable = [
    "reasonable>=0.2.6",
]
persistence = [
    "brickschema-rdflib-sqlalchemy>=0.6.1",
    "sqlalchemy>=2.0.41",
]
bacnet = [
    "bac0>=2025.6.10",
]
networkx = [
    "networkx>=3.0",
]
topquadrant = [
    "brick-tq-shacl>=0.4.1",
]
# retained so that existing `brickschema[shifty]` installs keep working;
# pyshifty is now a base dependency
shifty = []
all = [
    "brickschema[allegro]",
    "brickschema[bacnet]",
    "brickschema[brickify]",
    "brickschema[merge]",
    "brickschema[networkx]",
    "brickschema[orm]",
    "brickschema[persistence]",
    "brickschema[reasonable]",
    "brickschema[topquadrant]",
    "brickschema[web]",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pyontoenv>=0.4.0",
    "pytest>=8.4.1",
    "pytest-timeout>=2.3.1",
    "pytest-xdist>=3.8.0",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.0.2",
]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: mark test as slow to run (needs --runslow)",
]

[tool.hatch.build.targets.wheel]
packages = ["brickschema"]

[tool.hatch.build.targets.sdist]
include = ["brickschema", "docs", "tests", "Makefile", "README.md", "LICENSE", "pyproject.toml"]
exclude = ["docs/venv", "docs/_build"]

[build-system]
build-backend  = 'hatchling.build'
# license-files with an SPDX license expression needs PEP 639 support
requires       = ['hatchling>=1.27']
