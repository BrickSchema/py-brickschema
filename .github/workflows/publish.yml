name: Publish to PyPI

on:
  release:
    types: [published]

# no token is stored for publishing; authentication is via PyPI Trusted
# Publishing (OIDC), which requires id-token: write on the job below
permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: deploy
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        # setup-uv stopped publishing major tags at v8; pin the full version
        uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          # setup-uv v10 disables the cache on release events by default to
          # avoid cache poisoning; this job builds once, so keep it off rather
          # than force it back on for a workflow that publishes with OIDC
          enable-cache: false

      - name: Verify the lockfile is up to date
        run: uv lock --check

      - name: Build distribution artifacts
        run: uv build

      - name: Check artifact metadata
        run: uvx twine check dist/*

      - name: Publish to PyPI
        # 'always' rather than 'automatic' so a misconfigured trusted publisher
        # fails the release instead of silently falling back to a token
        run: uv publish --trusted-publishing always
